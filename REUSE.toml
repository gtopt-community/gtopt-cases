# REUSE annotations (https://reuse.software/spec-3.3/).  The licence texts
# are in LICENSES/; the rights statement is in LICENSING.md.  Third-party
# data carry LicenseRef-third-party-no-licence: no licence is granted by
# this repository and all rights stay with the rights holders.  When
# several annotations match a file, the last one in this file wins.
version = 1

# Documentation, catalog, profiles, line lifts and repository metadata
# written by the gtopt authors: public-domain dedication.
[[annotations]]
path = [
  "*.md",
  "**/*.md",
  "catalog.json",
  "profiles/**",
  "chile/daily_scheduling/line_lifts.json",
  ".github/**",
  ".gitattributes",
  ".gitignore",
  "ireland/**/.gitignore",
  "ruff.toml",
  "REUSE.toml",
]
SPDX-FileCopyrightText = "2026 The gtopt authors"
SPDX-License-Identifier = "CC0-1.0"

# Tools: the gtopt dual licence.
[[annotations]]
path = ["tools/**", ".githooks/**"]
SPDX-FileCopyrightText = "2026 Marcelo Matus and the gtopt contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later OR LicenseRef-gtopt-commercial"

# ---- Australia: AEMO (used under AEMO's copyright permissions)
[[annotations]]
path = "australia/**/source/**"
precedence = "override"
SPDX-FileCopyrightText = "Australian Energy Market Operator (AEMO)"
SPDX-License-Identifier = "LicenseRef-third-party-no-licence"

[[annotations]]
path = "australia/**/case/**"
precedence = "override"
SPDX-FileCopyrightText = [
  "Australian Energy Market Operator (AEMO)",
  "2026 The gtopt authors (conversion layer only)",
]
SPDX-License-Identifier = "LicenseRef-third-party-no-licence AND CC0-1.0"

